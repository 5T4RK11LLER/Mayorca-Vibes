<!doctype html>
<html lang="es">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Reservación | Mallorca Vibes</title>

      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

      <link rel="stylesheet" href="css/roots.css">
      <link rel="stylesheet" href="css/navbar.css">
      <link rel="stylesheet" href="css/footer.css">
      <link rel="stylesheet" href="css/reservation.css">

      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
  </head>
  <body id="body">
    <div id="navbar-container"></div>

    <div class="reservation-location-wrapper" id="reserva-ubicacion">

      <!-- ============ SECCIÓN: RESERVA ============ -->
      <section class="reservation-section" id="reservation">
        <h2 id="reservation-title">Reserva tu mesa</h2>
        <p id="reservation-subtitle">Disfruta de nuestra fusión hispano-cubana. ¡Te esperamos!</p>

        <form class="row g-3" id="formReservacion">
          <div class="col-md-6" id="field-name">
            <label for="inputName" class="form-label">Nombre y apellido</label>
            <input type="text" class="form-control" id="inputName" placeholder="Nombre y apellido" required>
          </div>

          <div class="col-md-6" id="field-date">
            <label for="fecha" class="form-label">Selecciona una fecha</label>
            <input type="text" class="form-control" id="fecha" placeholder="Selecciona una fecha" required>
          </div>

          <div class="col-md-6" id="field-time">
            <label for="hora" class="form-label">Hora</label>
            <input type="text" class="form-control" id="hora" placeholder="Selecciona una hora" required>
          </div>

          <div class="col-6 d-flex flex-column align-items-center" id="field-guests">
            <label class="form-label">Número de personas</label>
            <div class="input-group" style="max-width: 150px;">
              <button class="btn btn-outline-secondary" type="button" id="btnMenos">−</button>
              <input type="text" class="form-control text-center" id="numPersonas" value="1" readonly>
              <button class="btn btn-outline-secondary" type="button" id="btnMas">+</button>
            </div>
          </div>

          <div class="col-6 col-md-12 d-flex align-items-end justify-content-center" id="field-submit">
            <button type="submit" class="btn btn-primary" id="btnReservar">Reservar</button>
          </div>
        </form>
      </section>

      <!-- ============ SECCIÓN: UBICACIÓN ============ -->
      <section class="location-section" id="ubicacion">
        <h2 id="location-title">Ubicación</h2>
        <p id="location-subtitle">Ven a visitarnos, te esperamos con los brazos abiertos.</p>

        <div class="map-container" id="map-container">
          <iframe
            id="map-frame"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3086.564320762476!2d2.9886088743464616!3d39.32079822161362!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1297a9c0786b14e5%3A0x90d62228c50b0223!2sMallorca%20Vibes!5e0!3m2!1ses-419!2sca!4v1788480965249!5m2!1ses-419!2sca"
            width="100%"
            height="400"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
          </iframe>
        </div>

        <div class="text-center" id="map-cta">
          <a href="https://www.google.com/maps/place/Mallorca+Vibes/@39.3207982,2.9886089,17z/data=!4m6!3m5!1s0x1297a9c0786b14e5:0x90d62228c50b0223!8m2!3d39.3207941!4d2.9911838!16s%2Fg%2F11y14fl2mc?entry=ttu&g_ep=EgoyMDI2MDkwMi4wIKXMDSoASAFQAw%3D%3D"
             target="_blank"
             rel="noopener noreferrer"
             class="btn btn-primary"
             id="btnComoLlegar">
            Cómo llegar
          </a>
        </div>
      </section>

    </div>

    <script src="js/navbar.js"></script>

    <div id="footer-container"></div>
    <script src="js/footer.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/es.js"></script>

    <script src="js/selectTime.js"></script>
    <script src="js/selectDate.js"></script>
    <script src="js/countPerson.js"></script>
    <script src="js/sendReservation.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
